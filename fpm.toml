name = "FOSSIL"
version = "3.3.0"
license = "GPL-3.0"
author = "Stefano Zaghi"
maintainer = "stefano.zaghi@gmail.it"
copyright = "Copyright 2026 Stefano Zaghi"
description = "FOrtran Surfaces, Solids, Immersed boundaries and Level sets"

[dependencies]
BeFoR64 = { git="https://github.com/szaghi/BeFoR64.git" }
FACE = { git="https://github.com/szaghi/FACE.git" }
FLAP = { git="https://github.com/szaghi/FLAP.git" }
FoXy = { git="https://github.com/szaghi/FoXy.git" }
# no PENF_R16P: VecFor's fpm build is double precision since szaghi/VecFor#23, and the macro on PENF alone breaks it
PENF = { git="https://github.com/szaghi/PENF.git" }
StringiFor = { git="https://github.com/szaghi/StringiFor.git" }
VTKFortran = { git="https://github.com/szaghi/VTKFortran.git" }
VecFor = { git="https://github.com/szaghi/VecFor.git" }

# the library is src/lib: src/ also holds the tests, the fossilizer app and, in a release tarball, the bundled
# dependencies (src/third_party), which fpm would otherwise compile a second time next to its own copies
[library]
source-dir = "src/lib"

[build]
auto-executables = true
auto-tests = true

[fortran]
implicit-typing = false
implicit-external = false
source-form = "free"

[install]
library = true
