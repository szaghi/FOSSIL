name: Validation

# The heavy tests (issue #45): benches, sweeps, convergence studies, large meshes in src/tests/validation/.
# Not run per push (ci.yml runs the fast regression suite); run nightly, on demand, and before every release.
on:
  schedule:
    - cron: "17 2 * * *"   # nightly, 02:17 UTC
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validation:
    runs-on: ubuntu-latest
    container: ghcr.io/szaghi/fortran-toolchains:gnu-16.2
    permissions:
      contents: read
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Fetch dependencies
      if: hashFiles('**/.deps_config.ini') != ''
      run: FoBiS.py fetch

    - name: Build the validation suite
      run: FoBiS.py build --mode validation-gnu

    # one program per core: they are single-threaded (validation-gnu has no OpenMP) and write no files
    - name: Run the validation suite
      run: ./scripts/run_validation.sh -j "$(nproc)"

    - name: Upload the logs of the validation programs
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: validation-logs
        path: exe-validation/*.log
        retention-days: 14
