name: Validation

# Project-owned workflow (not managed by `fobis scaffold`), issue #45: the validation suite (benches, large meshes,
# sweeps, convergence studies) nightly and on demand, by the reusable matrix workflow of fortran-toolchains
# (https://github.com/szaghi/fortran-toolchains) in its gnu-16.2 image: scripts/ci/validation.sh builds the programs
# (mode validation-gnu) and runs them (scripts/run_validation.sh -j $(nproc)); their logs are the artifact
# validation-logs-<toolchain>. The per-push regression suite is ci.yml.

on:
  schedule:
    - cron: "17 2 * * *"   # nightly, 02:17 UTC
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validation:
    uses: szaghi/fortran-toolchains/.github/workflows/matrix.yml@v1
    with:
      toolchains: linux-gnu
      script: scripts/ci/validation.sh
      artifacts: exe-validation/*.log
      artifacts-name: validation-logs
